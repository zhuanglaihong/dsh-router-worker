# 提 PR 到 awesome-dsh-plugin 时，把这个文件原样复制成：
#   data/plugins/zhuanglaihong__dsh-router-worker.yml
#
# 一个插件一个文件（文件名 <owner>__<repo>.yml，owner/repo 里的 / 变 __）。
# 不要改 README.md —— 仓库里的两个 README 是脚本生成的，手改会撞到邻居条目。

url: https://github.com/zhuanglaihong/dsh-router-worker
name: zhuanglaihong/dsh-router-worker
category: workflow

# 可选但推荐：给市场卡片一张图标。必须放在本仓库里、GitHub 托管、位图
# （png/jpg/webp），约 96px 方形；SVG 与第三方图床会被拒。
# icon: https://raw.githubusercontent.com/zhuanglaihong/dsh-router-worker/main/assets/icon-180.png

# 可选：预构建 tarball（免 allowBuilds 构建授权，用户点一下就能装）。
# 资产名必须**不带版本号**，因为 latest/download/ 的文件名是照字面取的。
# 由 .github/workflows/release.yml 在推 tag 时产出。
tarball: https://github.com/zhuanglaihong/dsh-router-worker/releases/latest/download/dsh-router-worker.tgz

description:
  zh: "在左侧会话列表里把子代理会话画成主会话的缩进子树，并自带「Router 项目经理模式」：协调者按工单派活，工单落 SQLite、按并发上限排队、结果回流、卡死自动收尾。子树只读宿主的 data-row-key 与父子关系，宿主行一个字节都不改，缩进按主题字号计算，因此原生皮肤与会把行包进 box 重排的自定义皮肤下都不脱节。"
  en: "Draws subagent sessions as an indented subtree under their parent in the left sidebar, and ships a Router/Worker mode: the coordinator hands out work as tickets, tickets persist to SQLite, queue against the concurrency limit, deliver results back, and get swept when a worker goes silent. The subtree only reads the host's data-row-key and parent/child relation — it never modifies the host row — and sizes itself from the theme font token, so it stays aligned under native skins and under skins that wrap rows in a reordered box."
